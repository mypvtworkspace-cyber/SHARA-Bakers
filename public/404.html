<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sahara Bakers – Redirecting...</title>
    <script>
      // Single Page Application redirect for GitHub Pages
      // If a user reloads or navigates directly to a route, redirect cleanly to root
      var pathSegmentsToKeep = 1; // '/SHARA-Bakers/'
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
    <meta http-equiv="refresh" content="0;URL='/SHARA-Bakers/'" />
  </head>
  <body style="font-family: system-ui, -apple-system, sans-serif; background-color: #fafaf9; color: #44403c; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center;">
    <div>
      <h2 style="font-size: 1.5rem; margin-bottom: 0.5rem; color: #78350f;">Sahara Bakers</h2>
      <p style="font-size: 0.9rem; color: #78716c;">Warming the ovens on Railway Road, Bannu... Redirecting to menu...</p>
    </div>
  </body>
</html>
